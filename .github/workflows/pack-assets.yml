
          
          
name: Extract JSON from Zip
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract only JSON files from bundle
        run: |
          unzip -o assets-bundle.zip '*.json'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "Restore JSON files for AI Studio preview"
          git push
          
