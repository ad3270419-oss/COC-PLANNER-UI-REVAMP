name: Pack Assets into Zip
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip icon folders and remove loose files
        run: |
          zip -r assets-bundle.zip public/coc-assets public/icons
          git rm -r public/coc-assets public/icons
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets-bundle.zip
          git commit -m "Pack icon folders into assets-bundle.zip"
          git push
          
